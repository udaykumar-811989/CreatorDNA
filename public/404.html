<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found — CreatorDNA</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#06140D" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      /* Jungle dark, matching the app's locked palette. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #06140d;
        color: #e8f5ee;
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 460px;
        text-align: center;
        background: #0d1f16;
        border: 1px solid #16382a;
        border-radius: 24px;
        padding: 40px 32px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        display: block;
        margin: 0 auto 18px;
      }
      .code {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #16a85e;
        text-transform: uppercase;
        margin: 0 0 8px;
      }
      h1 { font-size: 27px; font-weight: 800; margin: 0 0 12px; }
      p { font-size: 15px; line-height: 22px; color: #9fb8ac; margin: 0 0 26px; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.primary {
        background: #16a85e;
        color: #04120b;
        font-weight: 800;
        font-size: 15px;
        text-decoration: none;
        border-radius: 14px;
        padding: 14px 26px;
      }
      a.primary:hover { background: #129155; }
      a.ghost {
        color: #9fb8ac;
        font-size: 15px;
        text-decoration: none;
        border: 1px solid #16382a;
        border-radius: 14px;
        padding: 14px 26px;
      }
      a.ghost:hover { color: #e8f5ee; border-color: #16a85e; }
      .support {
        display: inline-block;
        margin-top: 26px;
        font-size: 14px;
        color: #16a85e;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/og-image.png" alt="CreatorDNA" />
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p>
        The page you were looking for doesn’t exist — it may have moved, or the
        link is mistyped. The CreatorDNA app is one tap away.
      </p>
      <div class="actions">
        <a class="primary" href="/">Back to home</a>
        <a class="ghost" href="/help">Help Center</a>
      </div>
      <a class="support" href="mailto:support@creatordna.app">Email support@creatordna.app</a>
    </main>
  </body>
</html>
