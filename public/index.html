<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="CreatorDNA is the AI creator coach for Instagram — DNA scores, reel autopsies, trend radar and a next-move plan that tells you exactly what to post next."
    />
    <meta name="theme-color" content="#06140D" />
    <link rel="canonical" href="https://www.creatordna.in/" />

    <!-- Open Graph / Twitter — the landing is what gets shared. The app
         swaps these for the current route at runtime (App.tsx). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CreatorDNA" />
    <meta property="og:title" content="CreatorDNA — AI Creator Coach for Instagram Growth" />
    <meta
      property="og:description"
      content="DNA scores, reel autopsies, trend radar and a next-move plan that tells you exactly what to post next."
    />
    <meta property="og:url" content="https://www.creatordna.in/" />
    <meta property="og:image" content="https://www.creatordna.in/og-image.png" />
    <meta property="og:image:alt" content="CreatorDNA logo — a purple DNA helix" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CreatorDNA — AI Creator Coach for Instagram Growth" />
    <meta
      name="twitter:description"
      content="DNA scores, reel autopsies, trend radar and a next-move plan that tells you exactly what to post next."
    />
    <meta name="twitter:image" content="https://www.creatordna.in/og-image.png" />

    <!-- Icons: the export step does not inject these when public/favicon.ico
         exists, so they are declared here (apple-touch-icon included). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CreatorDNA",
        "url": "https://www.creatordna.in/",
        "logo": "https://www.creatordna.in/og-image.png",
        "description": "CreatorDNA is the AI creator coach for Instagram: DNA scores, reel autopsies, trend radar and a personalized next-move plan for creators.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@creatordna.app"
        }
      }
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
